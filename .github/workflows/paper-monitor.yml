name: Paper monitor (5 minute)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-monitor.yml'
      - 'api/monitor.js'
      - 'lib/monitor-auth.js'
  schedule:
    # Completed 5-minute bars arrive near :00/:05. Offset by two minutes to
    # avoid GitHub's busiest boundary. UTC avoids scheduler timezone drift.
    # KR 09:00-15:50 KST = 00:00-06:50 UTC.
    - cron: '2/5 0-6 * * 1-5'
    # US regular session spans 13:30-21:00 UTC across daylight/standard time.
    # The API performs the exact DST/session gate, so off-session calls idle.
    - cron: '2/5 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: stockdesk-paper-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request short-lived GitHub identity token
        id: oidc
        shell: bash
        run: |
          response="$(curl --silent --show-error --fail-with-body --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=stockdesk-paper-monitor")"
          token="$(jq -r '.value // empty' <<<"$response")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run Stockdesk paper monitor
        shell: bash
        env:
          MONITOR_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 55 \
            -H "Authorization: Bearer ${MONITOR_TOKEN}" \
            -H "User-Agent: stockdesk-github-monitor/1.0" \
            https://stockdesk-ivory.vercel.app/api/monitor
